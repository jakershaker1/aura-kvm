name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  puck-agent:
    name: Build Static ARM64 Puck Agent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: puck-agent
      - name: Run protocol & puck-agent unit tests
        run: cargo test -p aura-protocol -p aura-puck-agent --lib
      - name: Build aarch64-unknown-linux-musl aura-puck-agent
        run: cargo build --release -p aura-puck-agent --target aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: aura-puck-agent
          path: target/aarch64-unknown-linux-musl/release/aura-puck-agent

  build-macos:
    name: Build macOS (Apple Silicon)
    needs: puck-agent
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64
      - name: Download bundled aura-puck-agent
        uses: actions/download-artifact@v4
        with:
          name: aura-puck-agent
          path: target/aarch64-unknown-linux-musl/release
      - name: Run workspace unit tests
        run: |
          chmod +x target/aarch64-unknown-linux-musl/release/aura-puck-agent
          cargo test --workspace --lib
      - name: Build release host & UI + .app bundle
        run: |
          cargo build --release -p aura-host -p aura-ui
          ./scripts/bundle-macos.sh
      - name: Package macOS release zip
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist/aura-kvm-macos-arm64 release
          cp -R "target/release/Aura KVM.app" dist/aura-kvm-macos-arm64/
          cp target/release/aura-host README.md LICENSE-MIT LICENSE-APACHE dist/aura-kvm-macos-arm64/
          ditto -c -k --sequesterRsrc --keepParent dist/aura-kvm-macos-arm64 "release/aura-kvm-${RELEASE_TAG}-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: release/*.zip

  build-windows:
    name: Build Windows (x86_64)
    needs: puck-agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64
      - name: Download bundled aura-puck-agent
        uses: actions/download-artifact@v4
        with:
          name: aura-puck-agent
          path: target/aarch64-unknown-linux-musl/release
      - name: Run host & protocol unit tests
        run: cargo test -p aura-host -p aura-protocol --lib
      - name: Build release host & UI
        run: cargo build --release -p aura-host -p aura-ui
      - name: Package Windows release zip
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path "dist/aura-kvm-windows-x86_64", "release" | Out-Null
          Copy-Item "target/release/aura-ui.exe" "dist/aura-kvm-windows-x86_64/"
          Copy-Item "target/release/aura-host.exe" "dist/aura-kvm-windows-x86_64/"
          Copy-Item "target/aarch64-unknown-linux-musl/release/aura-puck-agent" "dist/aura-kvm-windows-x86_64/"
          Copy-Item "README.md", "LICENSE-MIT", "LICENSE-APACHE" "dist/aura-kvm-windows-x86_64/"
          Compress-Archive -Path "dist/aura-kvm-windows-x86_64/*" -DestinationPath "release/aura-kvm-$env:RELEASE_TAG-windows-x86_64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: release/*.zip

  build-linux:
    name: Build Linux (x86_64)
    needs: puck-agent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev \
            libgl1-mesa-dev \
            libwayland-dev
      - name: Download bundled aura-puck-agent
        uses: actions/download-artifact@v4
        with:
          name: aura-puck-agent
          path: target/aarch64-unknown-linux-musl/release
      - name: Run host & protocol unit tests
        run: cargo test -p aura-host -p aura-protocol --lib
      - name: Build release host & UI
        run: cargo build --release -p aura-host -p aura-ui
      - name: Package Linux release tarball
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          chmod +x target/aarch64-unknown-linux-musl/release/aura-puck-agent
          mkdir -p dist/aura-kvm-linux-x86_64 release
          cp target/release/aura-ui target/release/aura-host dist/aura-kvm-linux-x86_64/
          cp target/aarch64-unknown-linux-musl/release/aura-puck-agent dist/aura-kvm-linux-x86_64/
          cp packaging/linux/aura-kvm.desktop README.md LICENSE-MIT LICENSE-APACHE dist/aura-kvm-linux-x86_64/
          tar -C dist -czf "release/aura-kvm-${RELEASE_TAG}-linux-x86_64.tar.gz" aura-kvm-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: release/*.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [puck-agent, build-macos, build-windows, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Assemble release assets & checksums
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p out
          cp release-artifacts/dist-macos/*.zip out/
          cp release-artifacts/dist-windows/*.zip out/
          cp release-artifacts/dist-linux/*.tar.gz out/
          cp release-artifacts/aura-puck-agent/aura-puck-agent "out/aura-puck-agent-${RELEASE_TAG}-aarch64-linux-musl"
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -lh out
      - name: Create Release Notes & Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          printf '%s\n' \
            "## Aura KVM ${RELEASE_TAG}" \
            "" \
            "Share your keyboard and mouse with **XREAL Aura glasses** running **Android XR** over USB ADB or Wireless ADB—no root required." \
            "" \
            "> **Testing Caveat:** Only **macOS** has been hardware-tested on a physical XREAL Aura Compute Puck so far. The **Windows** and **Linux** builds compile cleanly and pass unit tests, but have not yet been verified on physical Windows/Linux machines. Bug reports and test feedback are welcome!" \
            "" \
            "### Included Downloads" \
            "- **macOS (Apple Silicon, tested):** \`aura-kvm-${RELEASE_TAG}-macos-arm64.zip\` — contains \`Aura KVM.app\` (with bundled \`aura-puck-agent\`) and headless \`aura-host\` CLI" \
            "- **Windows (x86_64, untested):** \`aura-kvm-${RELEASE_TAG}-windows-x86_64.zip\` — contains \`aura-ui.exe\`, \`aura-host.exe\`, and \`aura-puck-agent\`" \
            "- **Linux (x86_64, untested, Wayland & X11):** \`aura-kvm-${RELEASE_TAG}-linux-x86_64.tar.gz\` — contains \`aura-ui\`, \`aura-host\`, \`aura-puck-agent\`, and \`aura-kvm.desktop\`" \
            "- **Standalone Puck Agent:** \`aura-puck-agent-${RELEASE_TAG}-aarch64-linux-musl\`" \
            "- **Checksums:** \`SHA256SUMS.txt\`" \
            "" \
            "### Highlights in ${RELEASE_TAG}" \
            "- **Zero-Root Virtual HID (\`/dev/uhid\`):** Genuine keyboard, consumer media keys, and 5-button smooth-scroll mouse inside Android XR." \
            "- **Window Switching (Default):** Toggle anytime with \`Option+Cmd+X\` (\`Ctrl+Alt+X\` on Windows/Linux); clicking **Wired Mirroring** in Android XR automatically returns control to your host and syncs cursor position." \
            "- **Seamless Edge Switching \`[BETA]\` (Opt-in):** Single-monitor configurable edge crossing powered by live \`WMShell\` 3D head/panel/cursor tracking and closed-loop \`SpatialServo\` auto-calibration." \
            "- **Desktop UI + Floating Status HUD:** Auto-connect/reconnect, live RTT & 3D telemetry, persistent \`settings.conf\`, no Console/Terminal window on launch." \
            "" \
            "### macOS First-Launch Permissions" \
            "\`Aura KVM.app\` is ad-hoc signed in this release. After copying it into \`/Applications\`, grant **Accessibility** and **Input Monitoring** (via the in-app **Request Permissions** button or \`System Settings -> Privacy & Security\`), then quit (\`Cmd+Q\`) and reopen the app once." \
            > release-notes.md
          gh release create "${RELEASE_TAG}" out/* \
            --title "Aura KVM ${RELEASE_TAG}" \
            --notes-file release-notes.md \
            --verify-tag
